version: "3.9"

services:
  api:
    build: .
    container_name: academic-rag-api
    ports:
      - "8000:8000"
    volumes:
      # Persist vector store and downloaded papers outside the container
      # so they survive container restarts
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3